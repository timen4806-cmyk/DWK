name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configure SDK Properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create .env Configuration
        run: |
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Setup Keystores & Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SECRET_KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Setup debug.keystore from repository base64 or generate fallback
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            rm -f debug.keystore 2>/dev/null || true
            keytool -genkeypair -alias androiddebugkey -keypass android \
              -keystore debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          # 2. Setup release keystore from secrets if provided, or copy debug.keystore as valid fallback
          RAW_KEYSTORE="${KEYSTORE_BASE64:-$SIGNING_KEY}"
          if [ -n "$RAW_KEYSTORE" ]; then
            echo "Restoring release keystore from GitHub Secret..."
            TARGET_PATH="${SECRET_KEYSTORE_PATH:-my-upload-key.jks}"
            echo "$RAW_KEYSTORE" | base64 -d > "$TARGET_PATH" 2>/dev/null || true
          elif [ ! -f my-upload-key.jks ]; then
            cp debug.keystore my-upload-key.jks
          fi

          # 3. Export environment variables for Gradle signingConfigs
          echo "KEYSTORE_PATH=${SECRET_KEYSTORE_PATH:-my-upload-key.jks}" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${SECRET_STORE_PASSWORD:-android}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD:-android}" >> $GITHUB_ENV

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          ./gradlew assembleDebug --stacktrace --no-daemon --no-configuration-cache --max-workers=2 -Pandroid.builder.sdkDownload=true

      - name: Prepare APK Output
        run: |
          mkdir -p output-apks
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" output-apks/Data-Warga-Kos.apk
            echo "Successfully generated APK: output-apks/Data-Warga-Kos.apk"
            ls -lh output-apks/
          else
            echo "::error title=APK Not Found::No APK file found in app/build/outputs/apk/"
            find app/build/ -name "*.apk" 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Data-Warga-Kos-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
