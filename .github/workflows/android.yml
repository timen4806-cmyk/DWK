name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & Accept Licenses
        run: |
          set +e
          # Detect or fallback to standard Android SDK paths on GitHub runners
          export ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          # Ensure the runner user has write permissions to install packages & licenses
          if [ -d "$ANDROID_HOME" ]; then
            sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
            sudo chmod -R 775 "$ANDROID_HOME" 2>/dev/null || true
          fi

          # Prepare licenses directory in SDK location and user home
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || sudo mkdir -p "$ANDROID_HOME/licenses"
          sudo chown -R $USER:$USER "$ANDROID_HOME/licenses" 2>/dev/null || true
          mkdir -p "$HOME/.android/licenses" || true

          # Write all official Android SDK license hashes
          cat << 'EOF' > "$ANDROID_HOME/licenses/android-sdk-license"
24333f8a63b6825ea9c5514f83c2829b004d1fee
d56f5187479451eabf01fb78af6dfcb131a6481e
84831b9409646a24c0f30564922ec13270a1147f
EOF

          cat << 'EOF' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
84831b9409646a24c0f30564922ec13270a1147f
504667f4c0de7af1a06de9f4b1727b84351f2910
EOF

          cat << 'EOF' > "$ANDROID_HOME/licenses/android-googletv-license"
601085b94cd77f6b54fd864d7f7ac5c8882fc20b
EOF

          # Copy to ~/.android/licenses for legacy/fallback compatibility
          cp -r "$ANDROID_HOME/licenses/"* "$HOME/.android/licenses/" 2>/dev/null || true

          # Attempt to auto-accept remaining licenses with sdkmanager if present
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | grep bin/sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses 2>/dev/null || true
          fi
          exit 0

      - name: Create .env Configuration
        run: |
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Setup Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          # Fallback generation if keystore is missing or empty
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -alias androiddebugkey -keypass android \
              -keystore debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Ensure Executable Gradle Wrapper
        run: |
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon --no-configuration-cache -Pandroid.builder.sdkDownload=true

      - name: Prepare APK Output
        run: |
          mkdir -p output-apks
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" output-apks/Data-Warga-Kos.apk
            echo "Successfully generated APK: output-apks/Data-Warga-Kos.apk"
            ls -lh output-apks/
          else
            echo "Error: No APK file found in app/build/outputs/apk/"
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Data-Warga-Kos-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
